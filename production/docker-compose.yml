version: '3.3'

services:
  react:
    build:
      context: ../BubbleTMA
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    networks:
      - app_network

  telegram-bot:
    build:
      context: ../Telegram
      dockerfile: Dockerfile
    ports:
      - '8555:8555'
    networks:
      - app_network
    command: >
      sh -c "pip install -r requirements.txt &&
             python main.py"

  backend:
    build:
      context: ../Backend/BubbleGame
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    networks:
      - app_network

  transactions:
    build:
      context: ../Backend/Transactions
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    networks:
      - app_network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: postgres
    ports:
      - '5434:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - '6379:6379'
    networks:
      - app_network
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:

networks:
  app_network:
    driver: bridge
